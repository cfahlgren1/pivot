<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pivot: record, review, train, run</title>
<style>
  :root {
    --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #aeaeb2; --hair: rgba(0,0,0,.08);
    --blue: #0071e3; --green: #30d158; --amber: #ff9f0a; --red: #ff3b30;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Inter, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .board { margin: 0 0 44px; }
  .label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
  .label b { font: 600 15px var(--display); color: var(--foreground, #1d1d1f); }
  .label span { font-size: 13px; color: var(--muted-foreground, #6e6e73); }
  .label i { font-style: normal; font: 600 11px var(--mono); color: #fff; background: var(--blue); border-radius: 6px; padding: 2px 7px; }
  .fit { position: relative; width: 100%; aspect-ratio: 1200 / 780; }
  .fit.pair { aspect-ratio: 2440 / 780; }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; display: flex; gap: 40px; }

  /* window */
  .win { position: relative; width: 1200px; height: 780px; border-radius: 12px; overflow: hidden; color: var(--ink);
    background: radial-gradient(120% 90% at 30% 40%, #fff 0%, #f2f3f6 70%);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.22), 0 24px 60px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.06); }
  .win.dark { background: #0b0b0d; color: #f5f5f7; }
  .lights { position: absolute; top: 18px; left: 20px; display: flex; gap: 8px; z-index: 5; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .titlebar { height: 52px; display: flex; align-items: center; justify-content: center; position: relative; }
  .back { position: absolute; left: 84px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .tabs { display: flex; gap: 2px; background: rgba(0,0,0,.05); padding: 3px; border-radius: 9px; }
  .tabs span { font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: 7px; color: var(--ink-2); }
  .tabs span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .dark .tabs { background: rgba(255,255,255,.08); } .dark .tabs span { color: #a1a1a6; } .dark .tabs span.on { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }

  /* shared bits */
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--blue); margin: 0 0 10px; }
  h1 { font: 700 42px/1.05 var(--display); letter-spacing: -.032em; margin: 0 0 14px; }
  h2 { font: 700 26px/1.1 var(--display); letter-spacing: -.024em; margin: 0; }
  .lede { font-size: 16px; line-height: 1.45; color: var(--ink-2); margin: 0 0 22px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 12px; padding: 10px 20px; font-size: 15px; font-weight: 500; background: #fff;
    box-shadow: 0 .5px 1.5px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.1); white-space: nowrap; }
  .btn.primary { background: linear-gradient(#2a8bf2, #0a72e6); color: #fff; box-shadow: 0 .5px 1.5px rgba(0,60,140,.4); }
  .btn.danger { background: var(--red); color: #fff; box-shadow: none; }
  .btn.ghost { background: rgba(0,0,0,.05); box-shadow: none; }
  .btn.sm { padding: 6px 13px; font-size: 13px; border-radius: 9px; }
  .card { background: rgba(255,255,255,.88); border-radius: 16px; box-shadow: 0 0 0 .5px rgba(0,0,0,.1), 0 4px 20px rgba(0,0,0,.04); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(8px); }
  .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px rgba(255,59,48,.3); }
  .muted { color: var(--ink-2); } .mono { font-family: var(--mono); }
  .cam { position: relative; border-radius: 14px; overflow: hidden; background: #ddd; }
  .cam > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .cam .chip { position: absolute; top: 12px; left: 12px; }
  .cam .chip.r { left: auto; right: 12px; }
  .thumb { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 16/10; }
  .thumb > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .thumb .t { position: absolute; bottom: 6px; right: 6px; font: 600 10px var(--mono); color: #fff; background: rgba(0,0,0,.5); padding: 2px 5px; border-radius: 4px; }
  .thumb .m { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  .m.ok { background: var(--green); } .m.no { background: var(--red); }
  .thumb.sel { box-shadow: 0 0 0 3px var(--blue); }
  .thumb.off { opacity: .4; }
</style>
</head>
<body>
<div id="boards"></div>
<script>
// ── camera scenes (stylized stand-ins for live feeds) ─────────────────────────
let uid = 0;
function scene(kind, o = {}) {
  const u = `s${uid++}`;
  const cx = o.cx ?? 380, cy = o.cy ?? 205, rot = o.rot ?? 14, dark = o.dark;
  const table = `<defs>
      <radialGradient id="tb${u}" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="${dark ? '#3a3a3e' : '#e9e4dc'}"/><stop offset="1" stop-color="${dark ? '#151517' : '#bdb5a8'}"/></radialGradient>
      <linearGradient id="cube${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a55"/><stop offset="1" stop-color="#c8231a"/></linearGradient>
      <radialGradient id="bowl${u}" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#cfe3f5"/><stop offset=".75" stop-color="#5d8fbf"/><stop offset="1" stop-color="#2f5f8c"/></radialGradient>
      <filter id="sh${u}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>`;
  if (kind === 'top') return `<svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice">${table}
      <rect width="640" height="400" fill="url(#tb${u})"/>
      <rect x="70" y="60" width="500" height="290" rx="6" fill="none" stroke="rgba(255,255,255,.35)" stroke-dasharray="10 8" stroke-width="2"/>
      <ellipse cx="${o.bx ?? 470}" cy="${o.by ?? 260}" rx="70" ry="66" fill="rgba(0,0,0,.18)" filter="url(#sh${u})"/>
      <circle cx="${o.bx ?? 470}" cy="${o.by ?? 255}" r="64" fill="url(#bowl${u})"/><circle cx="${o.bx ?? 470}" cy="${o.by ?? 255}" r="44" fill="#9cc0e2" opacity=".55"/>
      <g transform="translate(${cx} ${cy}) rotate(${rot})"><rect x="-20" y="-16" width="44" height="44" rx="5" fill="rgba(0,0,0,.25)" filter="url(#sh${u})"/><rect x="-22" y="-22" width="44" height="44" rx="5" fill="url(#cube${u})"/><rect x="-22" y="-22" width="44" height="10" rx="4" fill="#fff" opacity=".18"/></g>
      <g stroke-linecap="round">
        <path d="M120 400 L190 300 L${cx - 70} ${cy + 30}" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="56" filter="url(#sh${u})" transform="translate(10 12)"/>
        <path d="M120 400 L190 300 L${cx - 70} ${cy + 30}" fill="none" stroke="#f4f4f2" stroke-width="44"/>
        <rect x="160" y="276" width="56" height="48" rx="8" fill="#1d1d1f"/>
        <rect x="${cx - 104}" y="${cy + 6}" width="52" height="46" rx="8" fill="#1d1d1f" transform="rotate(-18 ${cx - 78} ${cy + 29})"/>
        <path d="M${cx - 60} ${cy + 18} l40 -22 M${cx - 58} ${cy + 44} l44 4" stroke="#f4f4f2" stroke-width="13"/>
      </g></svg>`;
  if (kind === 'wrist') return `<svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice">${table}
      <rect width="640" height="400" fill="url(#tb${u})"/>
      <ellipse cx="${cx - 40}" cy="${cy + 80}" rx="130" ry="40" fill="rgba(0,0,0,.25)" filter="url(#sh${u})"/>
      <g transform="translate(${cx - 40} ${cy + 20}) rotate(${rot - 10})"><rect x="-95" y="-95" width="190" height="190" rx="18" fill="url(#cube${u})"/><rect x="-95" y="-95" width="190" height="40" rx="16" fill="#fff" opacity=".16"/></g>
      <path d="M0 400 L120 250 L210 270 L130 400 Z" fill="#f4f4f2"/><path d="M120 250 L210 270 L200 290 L118 268 Z" fill="#d9d9d6"/>
      <path d="M640 400 L520 230 L430 260 L500 400 Z" fill="#f4f4f2"/><path d="M520 230 L430 260 L440 280 L522 252 Z" fill="#d9d9d6"/>
      <rect x="0" y="0" width="640" height="400" fill="url(#vig)" opacity="0"/></svg>`;
  return `<svg viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice">${table}
      <rect width="640" height="400" fill="${dark ? '#18181b' : '#eceef1'}"/><rect y="230" width="640" height="170" fill="url(#tb${u})"/>
      <ellipse cx="470" cy="300" rx="80" ry="14" fill="rgba(0,0,0,.25)" filter="url(#sh${u})"/><path d="M400 262 Q470 330 540 262 Z" fill="url(#bowl${u})"/><ellipse cx="470" cy="262" rx="70" ry="12" fill="#2f5f8c"/>
      <rect x="${cx - 22}" y="262" width="40" height="38" rx="4" fill="url(#cube${u})"/>
      <g stroke-linecap="round" fill="none"><path d="M150 300 L150 230 L200 130 L${cx - 40} 170 L${cx - 10} 225" stroke="#f4f4f2" stroke-width="26"/>
      <rect x="120" y="240" width="60" height="60" rx="6" fill="#1d1d1f"/><rect x="${cx - 62}" y="150" width="40" height="40" rx="6" fill="#1d1d1f"/></g>
      <rect x="100" y="296" width="110" height="14" rx="4" fill="#f4f4f2"/></svg>`;
}
const cube = (i) => ({ cx: 280 + ((i * 97) % 160), cy: 130 + ((i * 61) % 120), rot: (i * 23) % 40, bx: 420 + ((i * 43) % 100), by: 210 + ((i * 71) % 100) });

function spark(seed, w = 300, h = 44, color = '#0071e3') {
  const pts = Array.from({ length: 60 }, (_, i) => {
    const x = (i / 59) * w, t = i / 59;
    const y = h / 2 + Math.sin(t * 6 + seed) * h * 0.28 + Math.sin(t * 15 + seed * 2) * h * 0.08;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function lossCurve(w, h, done = 0.62) {
  let a = [], b = [];
  for (let i = 0; i <= 120; i++) {
    const t = i / 120, x = t * w;
    const y = (v) => h - 12 - (h - 24) * v;
    const v = 0.06 + 0.9 * Math.exp(-t * 5.2) + Math.sin(i * 1.7) * 0.012 * (1 - t);
    const vv = 0.09 + 0.86 * Math.exp(-t * 4.6) + Math.cos(i * 0.9) * 0.01;
    if (t <= done) { a.push(`${x.toFixed(1)},${y(v).toFixed(1)}`); if (i % 10 === 0) b.push(`${x.toFixed(1)},${y(vv).toFixed(1)}`); }
  }
  const grid = [0.25, 0.5, 0.75].map((g) => `<line x1="0" x2="${w}" y1="${h * g}" y2="${h * g}" stroke="rgba(0,0,0,.06)"/>`).join('');
  const last = a.at(-1).split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${grid}
    <polyline points="${a.join(' ')}" fill="none" stroke="#0071e3" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="${b.join(' ')}" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="1 0" stroke-linejoin="round"/>
    ${b.map((p) => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="#ff9f0a"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#0071e3"/><circle cx="${last[0]}" cy="${last[1]}" r="10" fill="#0071e3" opacity=".18"/>
    <line x1="${last[0]}" x2="${last[0]}" y1="0" y2="${h}" stroke="rgba(0,0,0,.1)" stroke-dasharray="3 4"/></svg>`;
}

const chrome = (center = '', back = true) => `<div class="lights"><i></i><i></i><i></i></div>
  <div class="titlebar">${back ? '<span class="back">‹ Back</span>' : ''}${center}</div>`;
const loopTabs = (on) => `<div class="tabs">${['Set up', 'Record', 'Datasets', 'Train', 'Run'].map((t) => `<span class="${t === on ? 'on' : ''}">${t}</span>`).join('')}</div>`;

// ── boards ───────────────────────────────────────────────────────────────────
const boards = [];

// A. Studio record
boards.push({ tag: 'Record · A', name: 'Studio', note: 'Every camera live, takes pile up in a strip. For people recording 50 episodes in one sitting.', html: `
<div class="win">${chrome(loopTabs('Record'), false)}
  <div style="padding: 6px 28px 0; display:flex; align-items:center; gap:14px;">
    <div class="card" style="flex:1; padding:11px 16px; display:flex; align-items:center; gap:10px; font-size:15px;">
      <span class="muted" style="font-size:13px; font-weight:600;">Task</span> Pick up the red cube and put it in the bowl.
    </div>
    <div class="card" style="padding:11px 16px; font-size:14px;"><b>24</b> <span class="muted">of 50 episodes</span></div>
    <div class="card" style="padding:11px 16px; font-size:14px;"><span class="muted">Dataset</span> <b>cube-to-bowl</b></div>
  </div>
  <div style="display:grid; grid-template-columns: 1.55fr 1fr; gap:14px; padding:14px 28px 0; height:468px;">
    <div class="cam">${scene('top', { cx: 360, cy: 200 })}<span class="chip"><span class="rec"></span>REC 0:07</span><span class="chip r">Top · 1080p 30 fps</span></div>
    <div style="display:grid; grid-template-rows:1fr 1fr; gap:14px;">
      <div class="cam">${scene('wrist', { cx: 360, cy: 160 })}<span class="chip">Wrist</span></div>
      <div class="cam">${scene('front', { cx: 330 })}<span class="chip">Front</span></div>
    </div>
  </div>
  <div style="position:absolute; left:0; right:0; bottom:110px; display:flex; justify-content:center; align-items:center; gap:28px;">
    <span class="btn ghost sm">Discard</span>
    <div style="width:74px; height:74px; border-radius:50%; border:4px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15), 0 6px 20px rgba(0,0,0,.18); display:grid; place-items:center; background:#fff;">
      <div style="width:30px; height:30px; border-radius:7px; background:var(--red);"></div></div>
    <span class="btn ghost sm">Keep · ↩</span>
  </div>
  <div style="position:absolute; left:28px; right:28px; bottom:20px; display:flex; gap:10px; align-items:center;">
    ${Array.from({ length: 9 }, (_, i) => `<div class="thumb ${i === 4 ? 'off' : ''}" style="width:118px">${scene('top', cube(i + 15))}<span class="m ${i === 4 ? 'no' : 'ok'}">${i === 4 ? '✕' : '✓'}</span><span class="t">0:${18 + ((i * 7) % 12)}</span></div>`).join('')}
    <div style="width:118px; aspect-ratio:16/10; border-radius:10px; border:2px dashed rgba(255,59,48,.5); display:grid; place-items:center; font-size:12px; color:var(--red); font-weight:600;">Recording…</div>
  </div>
</div>` });

// B. Focus (dark)
boards.push({ tag: 'Record · B', name: 'Focus', note: 'One camera, full bleed, Camera-app controls. Nothing to read while your hands are on the arm.', html: `
<div class="win dark">
  <div style="position:absolute; inset:0;">${scene('top', { cx: 380, cy: 210, dark: true })}</div>
  <div style="position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.55), transparent 18%, transparent 70%, rgba(0,0,0,.75));"></div>
  ${chrome(loopTabs('Record'), false)}
  <div style="position:absolute; top:70px; left:0; right:0; text-align:center;">
    <div style="font: 600 13px var(--sans); color:rgba(255,255,255,.7); letter-spacing:.02em;">EPISODE 24 OF 50</div>
    <div style="font: 600 22px var(--display); margin-top:6px;">Pick up the red cube and put it in the bowl.</div>
  </div>
  <div style="position:absolute; top:150px; right:28px; display:grid; gap:10px; width:200px;">
    <div style="border-radius:12px; overflow:hidden; aspect-ratio:16/10; box-shadow:0 0 0 1px rgba(255,255,255,.2);">${scene('wrist', { cx: 360, cy: 160, dark: true })}</div>
    <div style="border-radius:12px; overflow:hidden; aspect-ratio:16/10; box-shadow:0 0 0 1px rgba(255,255,255,.2);">${scene('front', { cx: 330, dark: true })}</div>
  </div>
  <div style="position:absolute; bottom:40px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:60px;">
    <div style="text-align:center; width:120px;"><div style="font:600 30px var(--display); font-variant-numeric:tabular-nums;">0:07</div><div style="font-size:12px; color:rgba(255,255,255,.6);">of 0:30 max</div></div>
    <div style="width:84px; height:84px; border-radius:50%; border:4px solid #fff; display:grid; place-items:center;"><div style="width:32px; height:32px; border-radius:8px; background:var(--red);"></div></div>
    <div style="width:120px; display:flex; gap:6px; justify-content:center;">
      ${Array.from({ length: 6 }, (_, i) => `<span style="width:10px; height:10px; border-radius:50%; background:${i < 5 ? 'var(--green)' : 'rgba(255,255,255,.25)'}"></span>`).join('')}
    </div>
  </div>
  <div style="position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,255,255,.55);">Space to stop · ← discard · → keep</div>
</div>` });

// C. Guided (Pivot-native)
boards.push({ tag: 'Record · C', name: 'Guided', note: 'Same one-instruction rhythm as setup. Each take ends on an explicit Keep / Redo, with the clip looping.', html: `
<div class="win">${chrome(`<div style="display:flex; gap:6px;">${Array.from({ length: 4 }, (_, i) => `<i style="width:32px; height:4px; border-radius:2px; display:block; background:${i < 2 ? '#1d1d1f' : i === 2 ? 'var(--blue)' : 'rgba(0,0,0,.1)'}"></i>`).join('')}</div>`)}
  <div style="display:grid; grid-template-columns: 1.15fr 1fr; align-items:center; height:728px; padding: 0 64px 40px 40px; gap:48px;">
    <div>
      <div class="cam" style="aspect-ratio:16/10; box-shadow:0 20px 50px rgba(0,0,0,.14);">${scene('top', { cx: 455, cy: 248, rot: 4 })}
        <span class="chip">▶︎ Take 24 · looping</span><span class="chip r">0:21</span></div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        ${['Top', 'Wrist', 'Front'].map((c, i) => `<div style="flex:1; border-radius:10px; overflow:hidden; aspect-ratio:16/10; ${i === 0 ? 'box-shadow:0 0 0 2.5px var(--blue);' : 'opacity:.75;'}">${scene(['top', 'wrist', 'front'][i], { cx: 455, cy: 248, rot: 4 })}</div>`).join('')}
      </div>
    </div>
    <div>
      <p class="eyebrow">Recording · episode 24 of 50</p>
      <h1>Keep this take?</h1>
      <p class="lede">The cube made it into the bowl in 21 seconds. Keep it if the motion looks like how you’d want the robot to do it.</p>
      <div class="card" style="padding:14px 18px; display:grid; grid-template-columns:1fr auto; row-gap:10px; font-size:14px;">
        <span class="muted">Smoothness</span><b>Good</b>
        <span class="muted">Claw closed on the cube</span><b style="color:#1f8a3b;">Yes</b>
        <span class="muted">Ended at rest pose</span><b style="color:#c47400;">Not quite</b>
      </div>
      <div style="display:flex; gap:12px; margin-top:26px;"><span class="btn">Redo</span><span class="btn primary">Keep and reset scene</span></div>
      <p class="muted" style="font-size:13px; margin-top:16px;">Next: put the cube somewhere new. Recording starts in 5 s, or press Space.</p>
    </div>
  </div>
</div>` });

// D. Datasets library
boards.push({ tag: 'Review', name: 'Datasets', note: 'A sidebar app once setup is done. Browse episodes, scrub joints against video, replay a take on the real arm, push to the Hub.', html: `
<div class="win">
  <div class="lights"><i></i><i></i><i></i></div>
  <div style="display:grid; grid-template-columns:230px 1fr; height:100%;">
    <aside style="background:rgba(236,236,240,.8); border-right:.5px solid rgba(0,0,0,.1); padding:58px 12px 16px; font-size:13px;">
      ${[['Arms', [['Claw arm', 'ok'], ['Handle arm', 'ok']]], ['Cameras', [['Top', 'ok'], ['Wrist', 'ok'], ['Front', 'warn']]], ['Datasets', [['cube-to-bowl', 'sel', '48'], ['sock-fold', '', '12'], ['pen-in-cup', '', '30']]], ['Models', [['act-cube-v1', '', '82%'], ['smolvla-cube', 'run', '']]]]
        .map(([h, items]) => `<div style="font-size:11px; font-weight:700; color:var(--ink-3); margin:14px 10px 6px;">${h.toUpperCase()}</div>` + items.map(([n, s, c]) => `<div style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:7px; ${s === 'sel' ? 'background:var(--blue); color:#fff;' : ''}">
          <span style="width:7px; height:7px; border-radius:50%; background:${s === 'ok' ? 'var(--green)' : s === 'warn' ? 'var(--amber)' : s === 'run' ? 'var(--blue)' : s === 'sel' ? '#fff' : 'var(--ink-3)'}"></span>${n}<span style="margin-left:auto; opacity:.7;">${c ?? ''}</span></div>`).join('')).join('')}
    </aside>
    <main style="padding:22px 28px; overflow:hidden;">
      <div style="display:flex; align-items:center; gap:12px;">
        <h2>cube-to-bowl</h2><span class="muted" style="font-size:13px;">48 episodes · 17 min · 3 cameras</span>

}
